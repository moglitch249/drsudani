name: drsudani
description: "A new Flutter project for Dr. Sudani"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # DI
  get_it: ^7.6.4
  injectable: ^2.3.2

  # Navigation
  go_router: ^13.0.0

  # Networking
  dio: ^5.4.0
  google_sign_in: ^6.2.1

  # Serialization
  json_annotation: ^4.8.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI / Images
  cached_network_image: ^3.3.1
  flutter_animate: ^4.3.0
  pin_code_fields: ^8.0.1
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  cupertino_icons: ^1.0.6

  # HTML parsing
  html: ^0.15.4

  # Localization
  intl: 0.20.2

  # Fonts
  google_fonts: ^6.1.0

  # Utils
  flutter_svg: ^2.0.9
  # Security & Anti-Tampering
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.7
  flutter_jailbreak_detection: ^1.10.0
  crypto: ^3.0.3
  url_launcher: ^6.3.0
  lottie: ^3.1.2
  audioplayers: ^6.0.0
  showcaseview: ^3.0.0
  shared_preferences: ^2.2.3
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  injectable_generator: ^2.4.1
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/drsudani.png"
  remove_alpha_ios: true
flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/
    - assets/sounds/
